name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this new tag after a green build (must be v + the version, e.g. v1.0.0); empty: build only'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      # Release builds (a v* tag, or a manual run with release_tag) refuse an unpinned ffmpeg.
      NOVAGET_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build, test and package
        shell: pwsh
        env:
          # Read-only token: lets build.ps1 list the ffmpeg builds without hitting the anonymous API limit.
          GITHUB_TOKEN: ${{ github.token }}
          # The theme tests save their off-screen renders here (dark theme, Arabic right-to-left).
          NOVAGET_SCREENSHOTS: ${{ runner.temp }}/screens
        run: ./build.ps1 -SmokeTest

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/screens/*.png
          if-no-files-found: ignore

      - name: Print UI screenshots
        if: always()
        shell: pwsh
        # Base64 in 4 KB lines ("B64 <name> <part>"), so the renders can be reviewed from the log as well.
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'screens'
          if (Test-Path $dir) {
            foreach ($file in Get-ChildItem $dir -Filter *.png) {
              $text = [Convert]::ToBase64String([IO.File]::ReadAllBytes($file.FullName))
              for ($i = 0; $i -lt $text.Length; $i += 4000) {
                Write-Output ("B64 {0} {1}" -f $file.BaseName, $text.Substring($i, [Math]::Min(4000, $text.Length - $i)))
              }
            }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NovaGet-Setup
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore

  # A pushed v* tag, or a manual run with release_tag (which creates the tag on the built commit).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: Directory.Build.props
          sparse-checkout-cone-mode: false

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: NovaGet-Setup
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          version=$(sed -nE 's#.*<Version>([^<]+)</Version>.*#\1#p' Directory.Build.props)
          if [ "$TAG" != "v$version" ]; then
            echo "The tag $TAG does not match the version $version in Directory.Build.props"
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "NovaGet $version" \
            --generate-notes
