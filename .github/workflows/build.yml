name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build, test and package
        shell: pwsh
        env:
          # Read-only token: lets build.ps1 list the ffmpeg builds without hitting the anonymous API limit.
          GITHUB_TOKEN: ${{ github.token }}
          # The theme tests save their off-screen renders here (dark theme, Arabic right-to-left).
          NOVAGET_SCREENSHOTS: ${{ runner.temp }}/screens
        run: ./build.ps1 -SmokeTest

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/screens/*.png
          if-no-files-found: ignore

      - name: Print UI screenshots
        if: always()
        shell: pwsh
        # Base64 in 4 KB lines ("B64 <name> <part>"), so the renders can be reviewed from the log as well.
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'screens'
          if (Test-Path $dir) {
            foreach ($file in Get-ChildItem $dir -Filter *.png) {
              $text = [Convert]::ToBase64String([IO.File]::ReadAllBytes($file.FullName))
              for ($i = 0; $i -lt $text.Length; $i += 4000) {
                Write-Output ("B64 {0} {1}" -f $file.BaseName, $text.Substring($i, [Math]::Min(4000, $text.Length - $i)))
              }
            }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NovaGet-Setup
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: NovaGet-Setup
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "NovaGet ${GITHUB_REF_NAME#v}" \
            --generate-notes
